services:
  mongo:
    image: mongo:4.4
    container_name: persister-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-text_extractor_db}
    volumes:
      - mongo_data:/data/db
    networks:
      db-net:
        aliases: [mongo]
      db-dev:
    ports:
      - "127.0.0.1:27017:27017"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  db-net:
    name: db-net
    internal: true
  db-dev:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"

volumes:
  mongo_data:
