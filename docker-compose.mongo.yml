# MongoDB del microservicio persister.
# - db-net (internal: true): ruta privada app↔mongo, sin salida a internet.
#   Solo la app la alcanza; el Orquestador nunca se conecta a esta red.
# - db-dev: red secundaria SIN internal, necesaria porque Docker no publica
#   puertos de contenedores conectados solo a redes internas. Con el
#   masquerade deshabilitado no hay salida a internet; solo habilita el
#   puerto en loopback para dev/tests locales.
services:
  mongo:
    image: mongo:8
    container_name: persister-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-text_extractor_db}
    volumes:
      - mongo_data:/data/db
    networks:
      db-net:
        aliases: [mongo]
      db-dev:
    ports:
      - "127.0.0.1:27017:27017"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  db-net:
    name: db-net
    internal: true
  db-dev:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"

volumes:
  mongo_data:
