services:
  persister:
    image: pdf-extractext-repositorios:v${VERSION:-0.1.0}
    build: ../pdf-extractext-repositorios
    restart: unless-stopped
    environment:
      - TZ=${TZ:-America/Argentina/Mendoza}
      - HTTP_PORT=8083
      - MONGODB_URI=mongodb://mongo:27017/${MONGODB_DATABASE:-text_extractor_db}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-text_extractor_db}
      - REDIS_ADDR=redis:6379
      - STREAM_NAME=${STREAM_NAME:-document-events}
      - STREAM_GROUP=${STREAM_GROUP:-documents-persister}
      - DLQ_NAME=${DLQ_NAME:-document-events-dlq}
    networks:
      - mired
      - db-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/api/v1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

networks:
  mired:
    external: true
  db-net:
    external: true
