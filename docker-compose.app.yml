services:
  persister:
    build: .
    container_name: persister-app
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=mired"
      - "traefik.http.routers.persister.rule=Host(`persister.internal`)"
      - "traefik.http.routers.persister.entrypoints=web"
      - "traefik.http.services.persister.loadbalancer.server.port=8083"
    environment:
      MONGODB_URI: mongodb://mongo:27017/${MONGODB_DATABASE:-text_extractor_db}
      REDIS_ADDR: ${REDIS_ADDR:-persister-redis:6379}
    networks:
      mired:
        aliases: [persister, persister-redis]
      db-net:
    ports:
      - "127.0.0.1:8083:8083"
    security_opt:
      - no-new-privileges:true

networks:
  # Red del ecosistema: se crea con docker network create mired.
  mired:
    external: true
  # Red de datos creada por docker-compose.mongo.yml; acá solo se referencia.
  db-net:
    external: true
