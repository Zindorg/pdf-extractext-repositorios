services:
  persister:
    image: pdf-extractext-repositorios:v${VERSIONREP:-1.0.1}
    build: ../pdf-extractext-repositorios
    restart: unless-stopped
    environment:
      - TZ=${TZ:-America/Argentina/Mendoza}
      - HTTP_PORT=8083
      - MONGODB_URI=mongodb://mongo:27017/${MONGODB_DATABASE:-text_extractor_db}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-text_extractor_db}
      - REDIS_ADDR=redis:6379
      - STREAM_NAME=${STREAM_NAME:-document-events}
      - STREAM_GROUP=${STREAM_GROUP:-documents-persister}
      - DLQ_NAME=${DLQ_NAME:-document-events-dlq}
      - CONSUL_HTTP_ADDR=${CONSUL_HTTP_ADDR-http://consul:8500}
      - CONSUL_HTTP_TOKEN=${CONSUL_HTTP_TOKEN:-}
      - SERVICE_ADDRESS=persister
    networks: [mired, db-net]
    labels:
      - traefik.enable=true
      - traefik.edge=internal
      - traefik.docker.network=mired
      - traefik.http.routers.persister.rule=Host(persister.internal)
      - traefik.http.routers.persister.entrypoints=http
      - traefik.http.routers.persister.middlewares=int-ratelimit@file,int-cb@file
      - traefik.http.services.persister.loadbalancer.server.port=8083
networks:
  mired:
    external: true
  db-net:
    external: true